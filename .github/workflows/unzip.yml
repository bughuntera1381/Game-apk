name: Unzip Project
on: workflow_dispatch

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: unzip -o *.zip
      - name: Cleanup
        run: rm *.zip
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Extract project files automatically"
